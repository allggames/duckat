<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Shooter - Carnival</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <div class="top-banner"></div>
        <div class="curtain left"></div>
        <div class="curtain right"></div>
        
        <h1>SHOOTING</h1>
        
        <div id="score-board">Puntos: <span id="score">0</span></div>

        <div id="start-msg" onclick="startGame()">¡CLICK PARA JUGAR!</div>

        <div id="ducks-layer"></div>

       <div class="waves"></div>
        
        <div class="guns-container">
            <div class="gun gun-left">
                <div class="sight"></div> <div class="barrel"></div> <div class="stock"></div>  </div>
            
            <div class="gun gun-center">
                <div class="sight"></div>
                <div class="barrel"></div>
                <div class="stock"></div>
            </div>
            
            <div class="gun gun-right">
                <div class="sight"></div>
                <div class="barrel"></div>
                <div class="stock"></div>
            </div>
        </div>

    <script src="script.js"></script>
</body>
</html>
