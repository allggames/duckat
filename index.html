<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUCKAT - Carnival Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <div class="stage-background"></div>
        <div class="curtain left-curtain"></div>
        <div class="curtain right-curtain"></div>
        
        <div class="top-banner">
            <h1>DUCKAT</h1>
        </div>
        
        <div id="score-board">PUNTOS: <span id="score">0</span></div>
        <div id="start-btn" onclick="startGame()">¡JUGAR!</div>

        <div id="ducks-layer"></div>

        <div class="waves-layer">
            <div class="wave wave-back"></div>
            <div class="wave wave-front"></div>
        </div>
        <div class="stage-floor"></div>

        <div class="rifle-container">
            <div class="rifle">
                <div class="barrel-tip"></div>
                <div class="barrel"></div>
                <div class="sight"></div>
                <div class="forend"></div>
                <div class="stock"></div>
                <div class="trigger-guard"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
